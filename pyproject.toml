[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbird-nm"
dynamic = ["version"]
description = "Control NetBird from NetworkManager (nm-applet, Quickshell, nmcli) as a regular VPN connection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# The plugin itself also needs PyGObject and the NM typelib from the system
# (python-gobject + libnm on Arch); those aren't installable from PyPI sanely.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
netbird-nm = "netbird_nm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "netbird_nm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs root and a real NetworkManager (see tests/integration/README.md)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP007", "UP045", "SIM105"]
